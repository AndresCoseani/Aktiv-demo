# Despliegue de la API de Aktiv en Render (Blueprint).
# Render lo lee desde la raíz del repo: New → Blueprint → elegir el repo.
# La carpeta de la API (aktiv-api) ya está indicada abajo con rootDir.
#
# Los valores marcados `sync: false` los pide Render al crear el servicio
# (son secretos o dependen de tu cuenta): no se guardan en este archivo.
services:
  - type: web
    name: aktiv-api
    runtime: node
    plan: free
    # Ohio / Virginia son las regiones más cercanas a Supabase (ca-central-1, Montreal).
    # Cuanto más cerca de la base, más rápida responde la API.
    region: ohio
    branch: main
    autoDeploy: true
    # el servicio vive en esta carpeta del repo: Render corre el build y el start desde acá
    rootDir: aktiv-api
    # solo reconstruye cuando cambia algo de la API (o este archivo)
    buildFilter:
      paths:
        - aktiv-api/**
        - render.yaml

    # `--include=dev` es necesario: Render usa NODE_ENV=production y sin esto no
    # instalaría `nest` ni `typescript`, y el build fallaría.
    # `npm run build` compila primero el contrato (contrato/) y después la API.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # delante de la API hay dos proxies (Vercel y el balanceador de Render)
      - key: TRUST_PROXY
        value: "2"
      # Project URL de Supabase, p. ej. https://<ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # clave PUBLISHABLE (sb_publishable_...). Nunca la secret.
      - key: SUPABASE_ANON_KEY
        sync: false
      # URL del frontend en Vercel, p. ej. https://aktiv.vercel.app (sin barra final)
      - key: WEB_ORIGIN
        sync: false
      # Invitaciones de alumnos. La clave SECRET (service_role) solo la usa el módulo
      # de invitaciones/cuentas, después de comprobar que el profe es dueño del alumno.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # API key de Resend (conviene una restringida a "Sending access" de tu dominio)
      - key: RESEND_API_KEY
        sync: false
      # Remitente con dominio verificado en Resend, p. ej. Aktiv <aktiv@tudominio.com>
      - key: MAIL_FROM
        sync: false
