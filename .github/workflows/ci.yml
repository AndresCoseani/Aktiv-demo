name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      solo_backup:
        description: Ejecutar solo verificaciones del backup con datos ficticios
        type: boolean
        default: false

permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cambios:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detectar.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detectar
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SOLO_BACKUP: ${{ inputs.solo_backup }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          if os.environ['EVENTO'] == 'pull_request':
              archivos = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE'], os.environ['HEAD']], text=True).splitlines()
              backup = {'Codex.MD', '.github/workflows/ci.yml', '.github/workflows/db-backup.yml', 'scripts/backup_supabase.py', 'scripts/restore_drill.py', 'scripts/restore_fks.sql', 'scripts/extraer_backup.py', 'scripts/test_backup_supabase.py', 'scripts/test_backup_postgres.py', 'scripts/probar_backup_supabase_local.py', '.github/actions/restore-target/action.yml'}
              app = any(p not in backup for p in archivos)
          else:
              app = os.environ['SOLO_BACKUP'] != 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'app={str(app).lower()}\n')
          print('Verificación completa de app' if app else 'Cambios exclusivos de backup: controles PostgreSQL reales y pruebas offline')
          PY

  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba-ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar workflows de GitHub Actions
        run: |
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/ci.yml .github/workflows/db-backup.yml
      - name: Preparar cliente PostgreSQL 17 y GPG
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            sudo apt-get update
            sudo apt-get install -y curl ca-certificates gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y postgresql-client-17
          fi
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          command -v gpg
      - name: Pruebas del backup, dump y restore reales sin secretos de producción
        env:
          BACKUP_TEST_DB_URL: postgresql://postgres:prueba-ci@localhost:5432/postgres
        run: python3 -m unittest discover -s scripts -p 'test_backup*.py'

  api:
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aktiv-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aktiv-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build API y contrato (nest build)
        run: npm run build
      - name: Comprobar backups sin conexión ni datos reales
        run: python3 -m unittest discover -s ../scripts -p 'test_*.py'

  cliente:
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aktiv-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aktiv-client/package-lock.json
      - run: npm ci
      - run: npm run contrato:check
      - run: npm run lint
      - run: npm test
      - name: Build frontend de producción (next build)
        run: npm run build
      - run: npm run typecheck
      - name: Recuperar herramientas de navegador y PostgreSQL
        id: herramientas
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/checks
          key: checks-v1-${{ runner.os }}-${{ runner.arch }}-node22-playwright1.64.1-pglite0.5.14
      - name: Instalar herramientas si no están en caché
        if: steps.herramientas.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npm install --prefix "$RUNNER_TEMP/checks" --no-audit --no-fund playwright@1.64.1 @electric-sql/pglite@0.5.14
      - name: Recuperar Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ runner.arch }}-playwright1.64.1
      # Las bibliotecas del sistema se instalan en cada runner; no van en caché.
      - name: Instalar bibliotecas de Linux para Chromium
        timeout-minutes: 5
        run: '"$RUNNER_TEMP/checks/node_modules/.bin/playwright" install-deps chromium'
      - name: Descargar Chromium si no está en caché
        if: steps.chromium.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/checks/node_modules/.bin/playwright" install chromium
      - name: SQL y recorridos de navegador
        env:
          MENSUAL_URL: http://localhost:3101
          PLAYWRIGHT_CHANNEL: chromium
          TEMP: ${{ runner.temp }}
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/checks/node_modules/playwright/index.mjs"
          export PGLITE_MODULE="$RUNNER_TEMP/checks/node_modules/@electric-sql/pglite/dist/index.js"
          node ../aktiv-api/scripts/probar-mensual-sql.mjs
          node ../aktiv-api/scripts/probar-lucas-sql.mjs
          node ../scripts/probar-restore-sql.mjs
          npm run start -- --port 3101 > "$RUNNER_TEMP/aktiv-next.log" 2>&1 &
          servidor=$!
          trap 'kill "$servidor" 2>/dev/null || true' EXIT
          listo=0
          for intento in $(seq 1 60); do
            if curl --fail --silent http://localhost:3101/login > /dev/null; then listo=1; break; fi
            sleep 1
          done
          test "$listo" = 1
          node scripts/lucas.browser.mjs
          for modo in '' --guardado-rapido --semanas --alta --carga --catalogo --calentamiento --bloques-vacios --bloques --responsive; do
            node scripts/mensual.browser.mjs $modo
          done

  integracion:
    needs: cambios
    if: needs.cambios.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aktiv-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aktiv-api/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Iniciar Supabase descartable (nunca producción)
        run: |
          supabase start
          supabase status -o json > "$RUNNER_TEMP/supabase-local.json"
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/supabase-local.json")); fs.writeFileSync("test/.env.test",`SUPABASE_URL=${s.API_URL}\nSUPABASE_ANON_KEY=${s.ANON_KEY}\nSUPABASE_SERVICE_ROLE_KEY=${s.SERVICE_ROLE_KEY}\n`);'
      - run: npm run test:e2e
      - run: npm run test:db
      - name: Apagar entorno local
        if: always()
        run: if command -v supabase >/dev/null; then supabase stop --no-backup; fi

  resultado:
    name: CI completo
    if: always()
    needs: [cambios, backup, api, cliente, integracion]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todos los controles
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          r = json.loads(os.environ['RESULTADOS'])
          assert r['cambios']['result'] == r['backup']['result'] == 'success', 'Falló la detección o el backup'
          esperado = 'success' if r['cambios']['outputs']['app'] == 'true' else 'skipped'
          assert all(r[j]['result'] == esperado for j in ('api', 'cliente', 'integracion')), 'Hay controles fallidos, cancelados o inesperadamente omitidos'
          PY
